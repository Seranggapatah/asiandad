<!DOCTYPE html>
<html>
  <head>
    <title>Kanguru Rive</title>
    <meta charset="UTF-8" />
  </head>

  <body>
    <canvas id="rive-canvas"></canvas>

    <div class="controls">
      <div class="state-buttons" role="group" aria-label="state">
        <button type="button" data-state="0" disabled>Idle</button>
        <button type="button" data-state="1" disabled>Run</button>
        <button type="button" data-state="2" disabled>Jump</button>
        <button type="button" data-state="3" disabled>Slide</button>
      </div>
    </div>

    <script src="./index.ts" type="module"></script>
  </body>
</html>
